name: Build wheels

on:
  release:
    types:
      - created
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-wheel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    name: Generate matrix of builds
    runs-on: ubuntu-slim
    steps:
      - name: Extra includes
        id: includes
        run: |
          # Support Python 3.11 to 3.15 on major platforms
          # Support Python 3.11 to 3.15 on lesser-known Linux platforms
          # Support Python 3.11 to 3.15 on Windows ARM64 (win_arm64).
          import json, os
          include = [
              {
                  "os": "ubuntu",
                  "os-version": "latest",
                  "arch": "x86_64",
                  "tag": "cp3{11,12,13,14,14t,15,15t}-manylinux_x86_64",
              },
              {
                  "os": "ubuntu",
                  "os-version": "latest",
                  "arch": "x86_64",
                  "tag": "cp3{11,12,13,14,14t,15,15t}-musllinux_x86_64",
              },
              {
                  "os": "windows",
                  "os-version": "latest",
                  "arch": "x86_64",
                  "tag": "cp3{11,12,13,14,14t,15,15t}-win_amd64",
              },
              {
                  "os": "macos",
                  "os-version": "15",
                  "arch": "universal2",
                  "tag": "cp3{11,12,13,14,14t,15,15t}-macosx_universal2",
              },
          ]
          if os.environ["EVENT_NAME"] != "pull_request":
            include += [
                {
                    "os": "ubuntu",
                    "os-version": "24.04-arm",
                    "arch": "arm64",
                    "tag": "cp3{11,12,13,14,14t,15,15t}-manylinux_aarch64",
                },
                {
                    "os": "ubuntu",
                    "os-version": "24.04-arm",
                    "arch": "arm64",
                    "tag": "cp3{11,12,13,14,14t,15,15t}-musllinux_aarch64",
                },
                {
                    "os": "ubuntu",
                    "os-version": "22.04",
                    "arch": "ppc64le",
                    "tag": "cp3{11,12,13,14,14t,15,15t}-manylinux_ppc64le",
                },
                {
                    "os": "windows",
                    "os-version": "11-arm",
                    "arch": "arm64",
                    "tag": "cp3{11,12,13,14,14t,15,15t}-win_arm64",
                },
                {
                    "os": "windows",
                    "os-version": "latest",
                    "arch": "x86_64",
                    "tag": "cp3{11,12,13,14,14t,15,15t}-win32",
                },
            ]
          with open(os.environ["GITHUB_OUTPUT"], "a+") as f:
            print("data="+json.dumps({"include": include}), file=f)
          print("data="+json.dumps({"include": include}))
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}

    outputs:
      data: ${{ steps.includes.outputs.data }}

  build_sdist:
    name: Build sdist for freeze-core
    uses: $/.github/workflows/build-sdist.yml
    with:
      dev: ${{ github.event_name != 'release' }}

  build_wheel:
    needs:
      - build_sdist
      - matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.data) }}
    name: Build [${{ matrix.os }}-${{ matrix.os-version }}-${{ matrix.arch }}](job-${{ strategy.job-index }})
    runs-on: ${{ matrix.os }}-${{ matrix.os-version }}
    defaults:
      run:
        shell: bash
    env:
      UV_NO_PROGRESS: true
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download sdist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freeze-core-sdist
          path: dist

      - name: Checkout from sdist
        run: |
          (cd dist && tar xvf freeze_core-*.tar.gz)
          mv dist/freeze_core-*/* .
          rm -rf dist
          ls -l

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          activate-environment: true
          cache-dependency-glob: "pyproject.toml"
          enable-cache: false

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.arch != 'x86_64' && matrix.arch != 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.arch }}

      - name: Build wheels
        run: ./ci/build-wheel.sh "${MATRIX_TAG}"
        env:
          MATRIX_TAG: ${{ matrix.tag }}

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freeze-core-wheel-${{ matrix.os }}-job-${{ strategy.job-index }}
          path: wheelhouse
          compression-level: 0 # no compression
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
    name: Publish package to PyPI
    needs:
      - build_wheel
    environment:
      name: pypi
      url: https://pypi.org/p/freeze-core
    permissions:
      id-token: write # MANDATORY: Required for OIDC Trusted Publishing
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: wheelhouse
          pattern: freeze-core-*
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheelhouse/
          skip-existing: true
          verbose: true
