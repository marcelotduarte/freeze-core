name: Command

on: # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]

concurrency:
  group: cmd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish package to TestPyPI
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/testpypi')
    environment:
      name: ${{ github.event_name }}
      url: https://test.pypi.org/p/freeze-core
    permissions:
      id-token: write # MANDATORY: Required for OIDC Trusted Publishing
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Automated task
        run: echo "Triggered by PR ${PR}"
        env:
          PR: ${{ github.event.issue.number }}

      - name: Download all artifacts
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: ci.yml
          pr: ${{ github.event.issue.number }}
          name: freeze-core-wheel-* # pattern: freeze-core-wheel-*
          name_is_regexp: true
          path: wheelhouse
          merge_multiple: true # merge-multiple: true
          workflow_conclusion: success

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheelhouse/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
