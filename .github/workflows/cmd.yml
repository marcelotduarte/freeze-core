name: Command

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish package to TestPyPI
    if: |
      github.event.issue.pull_request && contains(github.event.comment.body, '/testpypi')
      || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event_name }}
      url: https://test.pypi.org/p/freeze-core
    permissions:
      id-token: write # MANDATORY: Required for OIDC Trusted Publishing
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Automated task
        run: echo "Triggered by PR ${PR}"
        env:
          PR: ${{ github.event.issue.number }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: wheelhouse
          pattern: freeze-core-wheel-*
          merge-multiple: true

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: wheelhouse/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
