name: Lint Commit Message

on: # zizmor: ignore[dangerous-triggers]
  # pull_request_target is NEVER ignored by GitHub's [ci skip]
  # and runs safely because we DO NOT check out the PR code.
  pull_request_target:
    types: [opened, edited, synchronize]

concurrency:
  group: sec-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-skip-tags:
    name: Validate Skip Tags
    runs-on: ubuntu-slim
    steps:
      - name: Block Native CI Skip
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        id: message
        run: |
          INVALID_PATTERN='\[(ci skip|skip ci|skip actions|no ci)\]'
          FOUND_BAD_TAG="0"

          echo "🔍 Checking PR title..."
          if echo "$PR_TITLE" | grep -riqE "$INVALID_PATTERN"; then
            echo "❌ ERROR: Skip tag detected in the PR title!">> $GITHUB_STEP_SUMMARY
            FOUND_BAD_TAG="1"
          fi

          echo "🔍 Checking all commit messages in the PR..."
          # Fetches messages directly from the GitHub API (No code checkout required)
          COMMIT_MSGS=$(gh api repos/$REPO/pulls/$PR_NUMBER/commits --jq '.[].commit.message')

          if echo "$COMMIT_MSGS" | grep -riqE "$INVALID_PATTERN"; then
            echo "❌ ERROR: Skip tag detected in one of the PR commits!">> $GITHUB_STEP_SUMMARY
            echo "----------------------------------------">> $GITHUB_STEP_SUMMARY
            echo "$COMMIT_MSGS" | grep -riE "$INVALID_PATTERN">> $GITHUB_STEP_SUMMARY
            echo "----------------------------------------">> $GITHUB_STEP_SUMMARY
            FOUND_BAD_TAG="1"
          fi

          if [ "$FOUND_BAD_TAG" == "1" ]; then
            echo "">> $GITHUB_STEP_SUMMARY
            echo "⚠️ WHY IS THIS AN ISSUE?">> $GITHUB_STEP_SUMMARY
            echo "Native tags like [ci skip] or [skip ci] bypass GitHub workflows entirely.">> $GITHUB_STEP_SUMMARY
            echo "This prevents security tools (SAST/CodeQL) from signing the commit, dropping our OpenSSF Scorecard compliance score.">> $GITHUB_STEP_SUMMARY
            echo "">> $GITHUB_STEP_SUMMARY
            echo "💡 WHAT SHOULD YOU DO?">> $GITHUB_STEP_SUMMARY
            echo "1. Amend your PR title or rebase to fix the commit messages.">> $GITHUB_STEP_SUMMARY
            echo "2. If you need to skip heavy testing to save resources, use our internal tag instead: [skip tests]">> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ No native skip tags found. SAST compliance preserved!">> $GITHUB_STEP_SUMMARY
